name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate Android scaffold (keeps our lib/ and pubspec)
        run: |
          cp -r lib /tmp/lib_bak && cp pubspec.yaml /tmp/pubspec_bak
          flutter create --platforms=android --project-name quicko_barcode --org dev.quicko .
          rm -rf lib && cp -r /tmp/lib_bak lib && cp /tmp/pubspec_bak pubspec.yaml
          rm -rf test
      - run: python3 tool/patch_android.py
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: barcode-studio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
