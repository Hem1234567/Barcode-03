name: quicko_barcode
description: Offline barcode generator with Bluetooth label printing.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  barcode_widget: ^2.0.4
  barcode: ^2.2.8
  esc_pos_utils_plus: ^2.0.4
  image: 4.5.4
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  share_plus: ^10.1.4
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  archive: ^4.0.0
  xml: ^6.5.0
  printing: ^5.13.2
  pdf: ^3.11.1
  file_picker: ^8.1.2

dependency_overrides:
  archive: 4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: false
